# Two Fit Mini App — https://app.twofit.uz/ → the bot's built-in web server (WEBAPP_HOST:WEBAPP_PORT).
# Install: /etc/nginx/sites-available/app.twofit.uz.conf, symlink into sites-enabled.
# The certificate must exist first: certbot certonly --nginx -d app.twofit.uz

server {
    listen 80;
    listen [::]:80;
    server_name app.twofit.uz;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name app.twofit.uz;

    ssl_certificate     /etc/letsencrypt/live/app.twofit.uz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.twofit.uz/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Subscription screenshots go up to 10 MB; the bot enforces the exact limit itself.
    client_max_body_size 12m;

    access_log /var/log/nginx/app.twofit.uz.access.log;
    error_log  /var/log/nginx/app.twofit.uz.error.log;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_request_buffering off;   # stream uploads straight to the bot
    }
}
